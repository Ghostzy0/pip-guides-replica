name: Reproducible bug
description: Report a failure with a small synthetic guide.
body:
  - type: markdown
    attributes:
      value: 'Do not upload personal screenshots, passwords, account data or private guides.'
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App edition/version, macOS version and architecture
    validations:
      required: true
